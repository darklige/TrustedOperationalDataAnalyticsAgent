[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustworthy-data-agent"
version = "0.1.0"
description = "A traceable, evaluated operations data agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=2.0,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "duckdb>=1.5,<2",
  "sqlglot>=27,<30",
  "pydantic>=2.10,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1", "pyyaml>=6,<7"]
mcp = ["mcp>=2,<3"]

[project.scripts]
trust-agent = "trust_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
